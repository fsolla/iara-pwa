# PR gate (OPS1 — GitHub Actions): feature → main roda `checks` — um job único
# sequencial (lint → build → unit → e2e) em runner hosted. O merge é gated pelo
# required check `checks` da proteção de `main` + auto-merge nativo do GitHub
# (o servidor só mergeia com o required check verde — sem branch protection
# server-side na era Forgejo, aqui a regra é real e vale até para admins).
#
# SEM verificador de `main` (decidido no gate): publicar é ato manual via
# `workflow_dispatch` (deploy.yml), que roda a suíte full antes de tocar o
# homeserver.
#
# Iara é um SPA — sem services/Postgres. O job id `checks` preserva o check-run
# `CI / checks` que o required check e o auto-merge usam (literal de match na
# proteção: `checks` — nome do check-run/job, não o display).
#
# Repo público → fork PR não queima minutes hosted: `if:` same-repo no job
# (mesma classe de guarda de RCE dos outros workflows).

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (tsc + vite)
        run: bun run build

      - name: Testes unitários (bun test)
        run: bun run test:unit

      - name: Instalar navegador do Playwright
        run: bunx playwright install --with-deps chromium

      - name: E2E (Playwright — só aqui, nunca local)
        run: bun run test:e2e
