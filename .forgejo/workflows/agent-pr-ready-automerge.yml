# Safety net (espelha o teqo): PRs de branch `agent/*` → main devem ser Ready +
# auto-merge. PRs humanos não passam por aqui — o merge deles é feito pelo
# agente local via `bun run pr -- --automerge` (com o PAT do usuário, que tem
# permissão de merge; o usuário sintético `forgejo-actions` do GITHUB_TOKEN não
# consegue mergear em repos de org).
#
# Roda scripts/forgejo-pr-automerge.mjs (plain Node): marca draft → ready, espera
# o contexto `checks` ficar green (ignorando o próprio status do job) e mergea
# por rebase.

name: Agent PR Ready + auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]

jobs:
  ready-automerge:
    if: >-
      github.event.pull_request.state == 'open' &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: host
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Mark Ready and merge when checks pass
        run: node scripts/forgejo-pr-automerge.mjs --pr "${{ github.event.pull_request.number }}"
